<svg viewBox="0 0 80 20" width="80" height="20" xmlns="http://www.w3.org/2000/svg"
     style="vertical-align: middle;">
  <!--
    Tufte sparkline: word-sized, no axes, no labels.
    Tufte's convention (Beautiful Evidence, pp. 50–51): first and last values in red, low and high in blue.
    Data: [15, 12, 8, 14, 6, 10, 3, 9, 5]
    SVG y grows downward: y = 20 - 2 - (v - min) / (max - min) * 16,
    so high values sit near the top.
  -->

  <!-- Data line -->
  <polyline
    points="0,2 10,6 20,11.3 30,3.3 40,14 50,8.7 60,18 70,10 80,15.3"
    fill="none"
    stroke="#666"
    stroke-width="1"
    stroke-linejoin="round"
  />

  <!-- Low (value=3, index=6) and high (value=15, index=0) — blue -->
  <circle cx="60" cy="18" r="1.5" fill="#4e79a7" />
  <circle cx="0" cy="2" r="1.5" fill="#4e79a7" />

  <!-- First (value=15) and last (value=5, index=8) — red, drawn on top -->
  <circle cx="0" cy="2" r="1.5" fill="#e41a1c" />
  <circle cx="80" cy="15.3" r="1.5" fill="#e41a1c" />
</svg>
